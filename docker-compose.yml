services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edura
      POSTGRES_PASSWORD: edura
      POSTGRES_DB: edura
    ports:
      - "5432:5432"
    volumes:
      - edura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edura"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://edura:edura@db:5432/edura
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-long-random-string-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-change-me}
    ports:
      - "3000:3000"

volumes:
  edura_pgdata:
